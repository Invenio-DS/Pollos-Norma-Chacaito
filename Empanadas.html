<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollos Norma - Empanadas 720x1280</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Ajuste base para evitar scroll y asegurar llenado total */
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor flexible que ocupa el 100% de la pantalla del TV */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
        }

        /* El video se adapta al contenedor manteniendo su proporción */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Contenedores individuales de precios */
        .price-overlay {
            position: absolute;
            display: flex;
            align-items: baseline;
            gap: 15px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 10;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            color: #fff;
            white-space: nowrap;
        }

        .label {
            font-size: 1.2rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .price-value {
            font-size: 1.8rem;
            letter-spacing: -1px;
            font-weight: bold;
        }

        #valRef { color: #f08f00; } /* Naranja */
        #valBs { color: #ffffff; }  /* Blanco */

        /* --- BLOQUE INFERIOR IZQUIERDO (INSTAGRAM Y TASA BCV) --- */
        .bottom-left-box {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        }

        .instagram-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .bcv-info {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .bcv-label {
            color: #f08f00;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
        }

        .bcv-value {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <video autoplay loop muted playsinline id="videoPlayer">
            <source src="https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Empanadas%20720x1280.mp4" type="video/mp4">
        </video>

        <!-- PRECIOS LATERALES -->
        <div class="price-overlay" id="overlayRef">
            <span class="label">Ref:</span>
            <span class="price-value" id="valRef">...</span>
        </div>

        <div class="price-overlay" id="overlayBs">
            <span class="label">Bs.</span>
            <span class="price-value" id="valBs">...</span>
        </div>

        <!-- ESQUINA INFERIOR IZQUIERDA: INSTAGRAM Y TASA BCV -->
        <div class="bottom-left-box" id="bottomLeftBox">
            <div class="instagram-info">
                <span>@pollosnormachacaito</span>
            </div>
            <div class="bcv-info">
                <span class="bcv-label">TASA BCV:</span>
                <span class="bcv-value" id="valBcv">---</span>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE POSICIONES (PORCENTAJE %)
        // ==========================================
        const REF_X_PCT = 74; // Centro horizontal
        const REF_Y_PCT = 56; // Un poco arriba del centro
        
        const BS_X_PCT = 82;  // Centro horizontal
        const BS_Y_PCT = 61;  // Un poco abajo del centro

        function applyPositions() {
            const overlayRef = document.getElementById('overlayRef');
            overlayRef.style.left = `${REF_X_PCT}%`;
            overlayRef.style.top = `${REF_Y_PCT}%`;
            overlayRef.style.transform = 'translate(-50%, -50%)';

            const overlayBs = document.getElementById('overlayBs');
            overlayBs.style.left = `${BS_X_PCT}%`;
            overlayBs.style.top = `${BS_Y_PCT}%`;
            overlayBs.style.transform = 'translate(-50%, -50%)';
        }
        // ==========================================

        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?gid=55761605&single=true&output=csv";
        const UPDATE_INTERVAL = 1000 * 60 * 60; 
        const APPEAR_DELAY = 1000;

        function parseCSVLine(line) {
            const result = [];
            let curValue = "";
            let inQuotes = false;
            for (let char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(curValue);
                    curValue = "";
                } else curValue += char;
            }
            result.push(curValue);
            return result;
        }

        // Función para interpretar correctamente puntos de miles y comas decimales
        function parseCustomFloat(val) {
            if (!val) return 0;
            let str = String(val).trim();
            
            if (str.includes('.') && str.includes(',')) {
                str = str.replace(/\./g, '').replace(',', '.');
            } else if (str.includes(',')) {
                str = str.replace(',', '.');
            } else if (str.includes('.')) {
                const parts = str.split('.');
                if (parts[parts.length - 1].length > 2) {
                    str = str.replace(/\./g, '');
                }
            }
            
            let n = parseFloat(str.replace(/[^\d.-]/g, ''));
            return isNaN(n) ? 0 : n;
        }

        // Formato para los precios principales (2 decimales)
        function formatPrice(value) {
            let n = parseCustomFloat(value);
            if (n === 0) return "0,00";
            return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Formato específico para la Tasa BCV (4 decimales)
        function formatPrice4Decimals(value) {
            let n = parseCustomFloat(value);
            if (n === 0) return "0,0000";
            return n.toLocaleString('de-DE', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
        }

        async function fetchPrices() {
            try {
                const response = await fetch(`${CSV_URL}&cachebuster=${Date.now()}`);
                if (!response.ok) throw new Error("Error de red");
                
                const text = await response.text();
                const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
                
                if (rows.length < 2) return;

                const columns = parseCSVLine(rows[1]);

                // Posiciones de columnas:
                // Columna D = Índice 3 (REF)
                // Columna E = Índice 4 (BS)
                // Columna F = Índice 5 (TASA BCV)
                let rawRef = columns[3]?.trim(); 
                let rawBs = columns[4]?.trim();
                let rawBcv = columns[5]?.trim();

                if (rawRef && rawBs) {
                    const formattedRef = formatPrice(rawRef);
                    const formattedBs = formatPrice(rawBs);
                    const formattedBcv = rawBcv ? formatPrice4Decimals(rawBcv) : "---";

                    updateUI(formattedRef, formattedBs, formattedBcv);
                    localStorage.setItem('cached_ref', formattedRef);
                    localStorage.setItem('cached_bs', formattedBs);
                    localStorage.setItem('cached_bcv', formattedBcv);
                }
            } catch (error) {
                console.error("Fallo al cargar:", error);
                loadFromCache();
            }
        }

        function loadFromCache() {
            const ref = localStorage.getItem('cached_ref');
            const bs = localStorage.getItem('cached_bs');
            const bcv = localStorage.getItem('cached_bcv');
            if (ref && bs) updateUI(ref, bs, bcv || "---");
        }

        function updateUI(ref, bs, bcv) {
            document.getElementById('valRef').innerText = ref;
            document.getElementById('valBs').innerText = bs;
            document.getElementById('valBcv').innerText = bcv;
            
            setTimeout(() => {
                document.getElementById('overlayRef').style.opacity = "1";
                document.getElementById('overlayBs').style.opacity = "1";
                document.getElementById('bottomLeftBox').style.opacity = "1";
            }, APPEAR_DELAY);
        }

        window.onload = () => {
            applyPositions();
            fetchPrices();
            setInterval(fetchPrices, UPDATE_INTERVAL);
        };
    </script>
</body>
</html>
