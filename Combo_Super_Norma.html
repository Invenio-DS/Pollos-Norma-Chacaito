<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollos Norma - Combo Súper Norma</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Roboto Mono', monospace;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .price-overlay {
            position: absolute;
            display: flex;
            align-items: baseline;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
            z-index: 10;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            white-space: nowrap;
            transform-origin: center;
        }

        .label {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .price-value {
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: -2px;
        }

        /* CAPA DE BLOQUEO */
        #block-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: none; /* Oculto por defecto */
        }
    </style>
</head>
<body>

    <!-- Pantalla negra de bloqueo -->
    <div id="block-screen"></div>

    <div class="container">
        <img src="https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Combo_Super_Norma.png" alt="Combo Super Norma" class="background-image">

        <div class="price-overlay" id="overlayRef">
            <span class="label" id="lblRef">Ref:</span>
            <span class="price-value" id="valRef">...</span>
        </div>

        <div class="price-overlay" id="overlayBs">
            <span class="label" id="lblBs">Bs.</span>
            <span class="price-value" id="valBs">...</span>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE POSICIÓN, ROTACIÓN Y COLORES
        // ==========================================
        const REF_X_PCT = 85;   
        const REF_Y_PCT = 38;   
        const BS_X_PCT = 84;    
        const BS_Y_PCT = 49;    
        const ROTACION = -6;

        // --- COLORES ---
        const COLOR_ETIQUETA_REF = "#f08f00"; 
        const COLOR_PRECIO_REF   = "#f08f00"; 

        const COLOR_ETIQUETA_BS  = "#ffffff"; 
        const COLOR_PRECIO_BS    = "#ffffff"; 
        // ---------------

        function applyStyles() {
            const overlayRef = document.getElementById('overlayRef');
            overlayRef.style.left = `${REF_X_PCT}%`;
            overlayRef.style.top = `${REF_Y_PCT}%`;
            overlayRef.style.transform = `translate(-50%, -50%) rotate(${ROTACION}deg)`;

            const overlayBs = document.getElementById('overlayBs');
            overlayBs.style.left = `${BS_X_PCT}%`;
            overlayBs.style.top = `${BS_Y_PCT}%`;
            overlayBs.style.transform = `translate(-50%, -50%) rotate(${ROTACION}deg)`;

            document.getElementById('lblRef').style.color = COLOR_ETIQUETA_REF;
            document.getElementById('valRef').style.color = COLOR_PRECIO_REF;
            document.getElementById('lblBs').style.color  = COLOR_ETIQUETA_BS;
            document.getElementById('valBs').style.color  = COLOR_PRECIO_BS;
        }
        // ==========================================

        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?gid=0&single=true&output=csv";
        const UPDATE_INTERVAL = 1000 * 60 * 5; // Verifica cada 5 minutos
        const APPEAR_DELAY = 100;

        function parseCSVLine(line) {
            const result = [];
            let curValue = "";
            let inQuotes = false;
            if (!line) return result;
            for (let char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(curValue);
                    curValue = "";
                } else curValue += char;
            }
            result.push(curValue);
            return result;
        }

        function formatPrice(value, type) {
            if (!value || value.trim() === "") return "0.00";
            if (type === 'bs') {
                let clean = value.replace(/[^\d.,]/g, '').replace(',', '.');
                let num = parseFloat(clean);
                if (isNaN(num)) return "0,00";
                return num.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else {
                let cleanValue = value.replace(/[^\d.,]/g, '').trim();
                return cleanValue.replace(',', '.');
            }
        }

        async function fetchPrices() {
            try {
                const response = await fetch(`${CSV_URL}&cachebuster=${Date.now()}`);
                const text = await response.text();
                const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
                
                // SISTEMA DE BLOQUEO: Celda H2 es Columna H (índice 7), Fila 2 (índice 1)
                const rowForBlock = parseCSVLine(rows[1]);
                const blockStatus = rowForBlock[7] ? rowForBlock[7].trim().toUpperCase() : "";
                
                const blockScreen = document.getElementById('block-screen');
                
                if (blockStatus === "BLOQUEAR") {
                    // Si está bloqueado, activamos la pantalla negra y no procesamos precios
                    blockScreen.style.display = "block";
                } else {
                    // Si no está bloqueado, ocultamos la pantalla negra y actualizamos precios
                    blockScreen.style.display = "none";
                    
                    if (rows.length < 13) { loadFromCache(); return; }
                    const columns = parseCSVLine(rows[12]); 
                    let rawRef = columns[3]?.trim(); 
                    let rawBs = columns[4]?.trim();
                    
                    if (rawRef && rawBs) {
                        const fRef = formatPrice(rawRef, 'ref');
                        const fBs = formatPrice(rawBs, 'bs');
                        updateUI(fRef, fBs);
                        localStorage.setItem('combo_cached_ref', fRef);
                        localStorage.setItem('combo_cached_bs', fBs);
                    }
                }
            } catch (e) { 
                console.error("Error en fetch:", e);
                loadFromCache(); 
            }
        }

        function loadFromCache() {
            const ref = localStorage.getItem('combo_cached_ref');
            const bs = localStorage.getItem('combo_cached_bs');
            if (ref && bs) updateUI(ref, bs);
        }

        function updateUI(ref, bs) {
            document.getElementById('valRef').innerText = ref;
            document.getElementById('valBs').innerText = bs;
            setTimeout(() => {
                document.getElementById('overlayRef').style.opacity = "1";
                document.getElementById('overlayBs').style.opacity = "1";
            }, APPEAR_DELAY);
        }

        window.onload = () => {
            applyStyles();
            fetchPrices();
            // El intervalo sigue ejecutándose siempre, verificando la celda H2 cada 5 minutos
            setInterval(fetchPrices, UPDATE_INTERVAL);
        };
    </script>
</body>
</html>
