<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Pollos Norma (720x1280)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style id="custom-styles">
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
        
        :root {
            --color-primario: #F08F00;    
            --color-acento: #dc2626;      
            --fondo-tarjeta: rgba(0, 0, 0, 0.9);
            --texto-precios: #ffffff;     
            --texto-descripcion: #ffffff; 
            
            --tamano-titulo-menu: 1.6rem;
            --tamano-categoria: 1.3rem;
            --tamano-nombre-plato: 1rem;
            --tamano-precio: 1.15rem; 

            --fuente-titulos: 'Montserrat', sans-serif;
            --fuente-cuerpo: 'Arial', sans-serif; 
            
            --tiempo-pagina: 15000ms; 
        }

        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--fuente-cuerpo);
            overflow: hidden;
        }

        #tv-screen {
            width: 720px;
            height: 1280px;
            background-color: #111;
            background-image: url('https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Fondo.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
            overflow: hidden; 
            position: relative;
        }

        #pages-container {
            flex-grow: 1;
            position: relative;
            padding: 0 15px;
            margin-top: 5px;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 15px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(40px);
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .page.exit {
            opacity: 0;
            transform: translateX(-80px);
        }

        .titulo-principal {
            font-family: var(--fuente-titulos);
            font-size: var(--tamano-titulo-menu);
            color: var(--color-primario);
        }

        .category-header {
            background: linear-gradient(90deg, var(--color-acento) 0%, rgba(220, 38, 38, 0) 100%);
            padding: 3px 10px;
            border-left: 5px solid var(--color-primario);
            font-family: var(--fuente-cuerpo); 
            text-transform: uppercase;
            font-weight: 700;
            font-size: var(--tamano-categoria);
            color: white;
            margin-top: 8px; 
            margin-bottom: 6px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .menu-item {
            background: var(--fondo-tarjeta);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            padding: 8px;
            height: 105px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name {
            color: var(--color-primario);
            font-family: var(--fuente-cuerpo); 
            font-weight: bold;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 5px;
            font-family: Arial, sans-serif;
        }

        .price-group {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .price-label {
            color: var(--color-primario);
            font-weight: bold;
            font-size: var(--tamano-precio);
        }

        .price-value {
            color: var(--texto-precios);
            font-weight: bold;
            font-size: var(--tamano-precio);
            letter-spacing: -0.5px;
        }

        .text-shadow-strong {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        #footer-notice {
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 90;
        }

        #page-indicator {
            position: absolute;
            bottom: 30px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: var(--color-primario);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid var(--color-primario);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="tv-screen">
        <header class="pt-4 pb-1 text-center shrink-0">
            <div class="inline-block bg-black/40 border-y border-brand-yellow/50 px-6 py-1 backdrop-blur-sm">
                <h1 class="titulo-principal font-black uppercase tracking-[0.3em] italic text-shadow-strong">
                    MENU
                </h1>
            </div>
        </header>

        <div id="status-message" class="flex-grow flex flex-col items-center justify-center text-center">
            <p id="status-text" class="text-[#F08F00] font-black text-lg animate-pulse uppercase">Cargando Menú...</p>
        </div>

        <main id="pages-container"></main>
        
        <div id="page-indicator" class="hidden"></div>
        <div id="footer-notice">LOS PRECIOS INCLUYEN EL I.V.A.</div>
    </div>

    <script>
        const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?output=csv";
        const MAX_ITEMS_PER_PAGE = 14;
        const PAGE_DURATION = 18000; 

        let currentPageIndex = 0;
        let totalPages = 0;
        let pageTimer = null;

        function formatBs(value) {
            if (!value) return "0,00";
            const num = parseFloat(value.toString().replace(',', '.'));
            return isNaN(num) ? "0,00" : num.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatRef(value) {
            if (!value) return "0.00";
            const num = parseFloat(value.toString().replace(',', '.'));
            return isNaN(num) ? "0.00" : num.toFixed(2);
        }

        function getDynamicFontSize(text) {
            const baseSize = 1.0; 
            const maxLength = 22; 
            if (text.length <= maxLength) return `${baseSize}rem`;
            const newSize = Math.max(0.7, baseSize - ((text.length - maxLength) * 0.025));
            return `${newSize}rem`;
        }

        function getColumnValue(row, keyword) {
            const keys = Object.keys(row);
            const foundKey = keys.find(k => k.trim().toUpperCase().includes(keyword.toUpperCase()));
            return foundKey ? row[foundKey] : null;
        }

        async function fetchMenu() {
            try {
                const response = await fetch(`${BASE_URL}&t=${Date.now()}`);
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            processAndPaginate(results.data);
                        }
                    }
                });
            } catch (err) {
                console.error("Error al cargar datos");
            }
        }

        function processAndPaginate(data) {
            const container = document.getElementById('pages-container');
            const statusMsg = document.getElementById('status-message');
            const indicator = document.getElementById('page-indicator');
            
            clearInterval(pageTimer);
            container.innerHTML = '';

            const pages = [];
            let currentItems = [];
            let lastCategory = "";

            data.forEach((row) => {
                const cat = getColumnValue(row, "CATEGORIA") || "OTROS";
                
                if ((cat !== lastCategory && currentItems.length > 0) || currentItems.length >= MAX_ITEMS_PER_PAGE) {
                    pages.push([...currentItems]);
                    currentItems = [];
                }
                
                currentItems.push({ ...row, categoryTitle: cat });
                lastCategory = cat;
            });

            if (currentItems.length > 0) {
                pages.push(currentItems);
            }

            totalPages = pages.length;
            
            pages.forEach((pageItems, i) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = `page ${i === 0 ? 'active' : ''}`;
                pageDiv.id = `page-${i}`;

                let lastCategoryInPage = "";
                let pageHtml = "";

                pageItems.forEach((item, idx) => {
                    if (item.categoryTitle !== lastCategoryInPage) {
                        if (lastCategoryInPage !== "") pageHtml += `</div>`;
                        
                        const isContinuation = (idx === 0 && i > 0 && item.categoryTitle === pages[i-1][pages[i-1].length - 1].categoryTitle);
                        
                        pageHtml += `<div class="category-header">${item.categoryTitle} ${isContinuation ? '<small class="text-[9px] opacity-70">(Cont.)</small>' : ''}</div>`;
                        pageHtml += `<div class="grid grid-cols-2 gap-2 mb-2">`;
                        lastCategoryInPage = item.categoryTitle;
                    }

                    const itemName = getColumnValue(item, "NOMBRE") || "Sin Nombre";
                    const itemDesc = getColumnValue(item, "DESCRIPCION") || "";
                    const itemRef = getColumnValue(item, "Ref") || "0";
                    const itemBs = getColumnValue(item, "Bs") || "0";

                    pageHtml += `
                        <div class="menu-item">
                            <div>
                                <h3 class="item-name uppercase" style="font-size: ${getDynamicFontSize(itemName)}">${itemName}</h3>
                                <p class="text-white text-[8.5px] leading-[1.1] line-clamp-3 italic font-medium mt-0.5">${itemDesc}</p>
                            </div>
                            <div class="price-row">
                                <div class="price-group">
                                    <span class="price-label">Ref:</span>
                                    <span class="price-value">${formatRef(itemRef)}</span>
                                </div>
                                <div class="price-group">
                                    <span class="price-label">Bs:</span>
                                    <span class="price-value">${formatBs(itemBs)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                pageHtml += `</div>`;
                pageDiv.innerHTML = pageHtml;
                container.appendChild(pageDiv);
            });

            statusMsg.style.display = 'none';
            indicator.classList.remove('hidden');
            updateIndicator();
            startRotation();
        }

        function updateIndicator() {
            const indicator = document.getElementById('page-indicator');
            indicator.innerText = `${currentPageIndex + 1} / ${totalPages}`;
        }

        function startRotation() {
            if (totalPages <= 1) return;
            pageTimer = setInterval(() => {
                const prevPage = document.getElementById(`page-${currentPageIndex}`);
                prevPage.classList.remove('active');
                prevPage.classList.add('exit');
                
                currentPageIndex = (currentPageIndex + 1) % totalPages;
                const nextPage = document.getElementById(`page-${currentPageIndex}`);
                
                nextPage.classList.remove('exit');
                setTimeout(() => {
                    nextPage.classList.add('active');
                    setTimeout(() => { prevPage.classList.remove('exit'); }, 800);
                    updateIndicator();
                }, 50);
            }, PAGE_DURATION);
        }

        window.onload = fetchMenu;
        setInterval(fetchMenu, 300000); 
    </script>
</body>
</html>
