<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Pollos Norma (720x1280)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style id="custom-styles">
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Montserrat:wght@400;700;900&family=Roboto+Mono:wght@700&display=swap');
        
        :root {
            --color-primario: #F08F00;    
            --color-acento: #dc2626;      
            --texto-precios: #ffffff;     
            --texto-descripcion: #cccccc; 
            
            /* CONTROL INDEPENDIENTE DEL LOGO */
            --logo-ancho: 660px;         
            --logo-alto: auto;           

            --tamano-titulo-menu: 3.5rem; 
            --tamano-categoria: 1.5rem;
            --tamano-nombre-plato: 1rem;
            --tamano-precio: 1rem; 

            --tamano-fuente-footer: 0.6rem; 
            --distancia-del-borde: 30px; 

            --fuente-titulos: 'Bungee', cursive;    
            --fuente-categorias: 'Bungee', cursive; 
            --fuente-precios: 'Roboto Mono', monospace; 
            --fuente-cuerpo: 'Montserrat', sans-serif; 
            
            --tiempo-pagina: 18000ms; 
        }

        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--fuente-cuerpo);
            overflow: hidden;
        }

        #tv-screen {
            width: 100vw;
            height: 100vh;
            max-width: 720px;
            max-height: 1280px;
            aspect-ratio: 720 / 1280;
            background-color: #111;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Fondo.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        header {
            flex-shrink: 0;
            z-index: 100;
            position: relative;
            width: 100%;
            height: 180px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-menu {
            position: absolute;
            top: 20px; 
            left: 20px; 
            /* Uso de variables independientes */
            width: var(--logo-ancho);
            height: var(--logo-alto);
            filter: drop-shadow(0px 8px 15px rgba(0,0,0,1));
            opacity: 1 !important;
            object-fit: contain; /* Asegura que la imagen no se deforme si las proporciones no coinciden */
        }

        .titulo-principal {
            display: none;
        }

        #pages-container {
            flex-grow: 1;
            position: relative;
            padding: 0 30px;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 30px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s ease-in-out;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
        }

        .category-header {
            color: #fff;
            background-color: var(--color-acento);
            font-family: var(--fuente-categorias);
            font-size: var(--tamano-categoria);
            text-transform: uppercase;
            padding: 5px 15px;
            margin: 25px 0 15px 0;
            display: inline-block;
            transform: rotate(-1deg);
            border-radius: 5px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .menu-item {
            margin-bottom: 3px;
            padding-bottom: 1px;
            border-bottom: 0px dashed rgba(255, 255, 255, 0.15);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            gap: 10px;
        }

        .item-name {
            color: #F08F00;
            font-weight: 900;
            text-transform: uppercase;
            font-size: var(--tamano-nombre-plato);
            flex: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .item-desc {
            color: var(--texto-descripcion);
            font-size: 0.60rem;
            flex: 1;
            margin-top: 0px;
            font-style: italic;
        }

        .price-container {
            font-family: var(--fuente-precios);
            font-weight: 900;
            font-size: var(--tamano-precio);
            display: grid;
            grid-template-columns: 45px 1fr; 
            align-items: baseline;
            min-width: 160px; 
        }

        .price-label {
            color: var(--color-primario);
            font-size: 0.7rem;
            text-align: left; 
        }

        .price-value {
            color: #ffffff;
            text-align: right; 
        }

        #footer-float {
            position: absolute;
            bottom: var(--distancia-del-borde);
            left: 0;
            width: 100%;
            padding: 0 40px;
        }

        .footer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            padding: 12px;
            border-radius: 50px;
            border: 2px solid var(--color-primario);
            backdrop-filter: blur(5px);
        }

        .footer-text {
            color: #F08F00;
            font-size: var(--tamano-fuente-footer);
            font-weight: 800;
            font-family: var(--fuente-categorias);
            letter-spacing: 0.2em;
        }

        #page-indicator {
            position: absolute;
            right: 25px;
            color: var(--color-primario);
            font-weight: 900;
            font-family: var(--fuente-titulos);
            font-size: 0.6rem;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <div id="tv-screen">
        <header>
            <img src="https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Logo-Solo-720p.png" alt="Logo Pollos Norma" class="logo-menu">
            <h1 class="titulo-principal">MENÚ</h1>
        </header>

        <div id="status-message" class="flex-grow flex flex-col items-center justify-center">
            <div class="w-12 h-12 border-4 border-t-[#F08F00] border-gray-800 rounded-full animate-spin mb-4"></div>
            <p class="text-[#F08F00] font-black uppercase tracking-widest text-sm">Cargando Brasas...</p>
        </div>

        <main id="pages-container"></main>
        
        <div id="footer-float">
            <div class="footer-container">
                <div class="footer-text">LOS PRECIOS INCLUYEN EL I.V.A.</div>
                <div id="page-indicator" class="hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?output=csv";
        const MAX_ITEMS_PER_PAGE = 14; 
        const PAGE_DURATION = 18000; 

        let currentPageIndex = 0;
        let totalPages = 0;
        let pageTimer = null;

        function getVal(row, key) {
            if (!row) return "";
            const targetKey = key.toUpperCase().trim();
            const keys = Object.keys(row);
            let actualKey = keys.find(k => k.trim().toUpperCase() === targetKey);
            if (!actualKey && targetKey === "NOMBRE") {
                actualKey = keys.find(k => k.toUpperCase().includes("NOMBRE") || k.toUpperCase().includes("PLATO") || k.toUpperCase().includes("PRODUCTO"));
            }
            if (!actualKey) {
                actualKey = keys.find(k => k.toUpperCase().includes(targetKey));
            }
            return actualKey ? (row[actualKey] ? row[actualKey].trim() : "") : "";
        }

        function formatPrice(val) {
            if (val === undefined || val === null || val === "" || val === "0") return "0,00";
            let cleanVal = String(val).replace(/[^\d,.-]/g, '').replace(',', '.');
            let n = parseFloat(cleanVal);
            return isNaN(n) ? "0,00" : n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function fetchMenu() {
            try {
                const response = await fetch(`${BASE_URL}&t=${Date.now()}`);
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data?.length > 0) {
                            const cleanData = results.data.filter(r => getVal(r, "NOMBRE") !== "");
                            renderMenu(cleanData);
                        }
                    }
                });
            } catch (err) { console.error("Error al obtener datos:", err); }
        }

        function renderMenu(data) {
            const container = document.getElementById('pages-container');
            const status = document.getElementById('status-message');
            const indicator = document.getElementById('page-indicator');
            container.innerHTML = '';
            
            const pages = [];
            let currentItems = [];
            
            data.forEach((row) => {
                const cat = getVal(row, "CATEGORIA") || "VARIOS";
                if (currentItems.length >= MAX_ITEMS_PER_PAGE) {
                    pages.push([...currentItems]);
                    currentItems = [];
                }
                currentItems.push({ ...row, catName: cat });
            });
            if (currentItems.length > 0) pages.push(currentItems);
            totalPages = pages.length;

            pages.forEach((pageData, pIdx) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = `page ${pIdx === 0 ? 'active' : ''}`;
                pageDiv.id = `page-${pIdx}`;
                let html = "";
                let currentCatInPage = "";

                pageData.forEach((item) => {
                    if (item.catName !== currentCatInPage) {
                        html += `<div class="category-header">${item.catName}</div>`;
                        currentCatInPage = item.catName;
                    }
                    
                    const nombrePlato = getVal(item, "NOMBRE");
                    const refPrice = getVal(item, "REF");
                    const bsPrice = getVal(item, "BS");
                    const descPlato = getVal(item, "DESCRIPCION");

                    html += `
                        <div class="menu-item">
                            <div class="item-row">
                                <div class="item-name">${nombrePlato}</div>
                                <div class="price-container">
                                    <span class="price-label">Ref:</span>
                                    <span class="price-value">${formatPrice(refPrice)}</span>
                                </div>
                            </div>
                            <div class="item-row">
                                <div class="item-desc">${descPlato}</div>
                                <div class="price-container" style="font-size: 1rem; opacity: 1;">
                                    <span class="price-label">Bs.</span>
                                    <span class="price-value">${formatPrice(bsPrice)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                pageDiv.innerHTML = html;
                container.appendChild(pageDiv);
            });

            status.style.display = 'none';
            indicator.classList.remove('hidden');
            updateIndicator();
            startRotation();
        }

        function updateIndicator() {
            document.getElementById('page-indicator').innerText = `${currentPageIndex + 1}/${totalPages}`;
        }

        function startRotation() {
            if (totalPages <= 1) return;
            if (pageTimer) clearInterval(pageTimer);
            pageTimer = setInterval(() => {
                const activePage = document.querySelector('.page.active');
                if (activePage) activePage.classList.remove('active');
                
                currentPageIndex = (currentPageIndex + 1) % totalPages;
                document.getElementById(`page-${currentPageIndex}`).classList.add('active');
                updateIndicator();
            }, PAGE_DURATION);
        }

        window.onload = fetchMenu;
        setInterval(fetchMenu, 300000); 
    </script>
</body>
</html>
