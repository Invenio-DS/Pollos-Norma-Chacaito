<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Pollos Norma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style id="custom-styles">
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
        
        :root {
            /* === CONFIGURACIÓN DE COLORES === */
            --color-primario: #F08F00;    
            --color-acento: #dc2626;      
            --fondo-tarjeta: rgba(0, 0, 0, 0.85);
            --texto-precios: #ffffff;     
            --texto-descripcion: #ffffff; 
            
            /* === CONFIGURACIÓN DE TAMAÑOS === */
            --tamano-titulo-menu: 2.25rem;
            --tamano-categoria: 1.8rem;
            --tamano-nombre-plato: 1.25rem;
            --tamano-precio: 1.4rem;

            /* === CONFIGURACIÓN DE FUENTES === */
            --fuente-titulos: 'Montserrat', sans-serif;
            --fuente-cuerpo: 'Arial', sans-serif; 
        }

        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--fuente-cuerpo);
            overflow: hidden;
        }

        #tv-screen {
            width: 800px;
            height: 1200px;
            background-color: #111;
            background-image: url('https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Fondo.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            border: 2px solid #222;
            overflow: hidden; 
            position: relative;
        }

        #scroll-area {
            flex-grow: 1;
            overflow-y: auto; 
            padding: 0 24px;
            scrollbar-width: none; 
            scroll-behavior: smooth;
        }

        #scroll-area::-webkit-scrollbar { display: none; }

        .titulo-principal {
            font-family: var(--fuente-titulos);
            font-size: var(--tamano-titulo-menu);
            color: var(--color-primario);
        }

        .category-header {
            background: linear-gradient(90deg, var(--color-acento) 0%, rgba(220, 38, 38, 0) 100%);
            padding: 8px 15px;
            border-left: 8px solid var(--color-primario);
            font-family: var(--fuente-cuerpo); 
            text-transform: uppercase;
            font-weight: 700;
            font-size: var(--tamano-categoria);
            color: white;
            margin-top: 10px; /* Reducido para evitar cortes */
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .menu-item {
            background: var(--fondo-tarjeta);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 14px;
            min-height: 130px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name {
            font-size: var(--tamano-nombre-plato);
            color: var(--color-primario);
            font-family: var(--fuente-cuerpo); 
            font-weight: bold;
        }

        .item-price-ref {
            font-size: var(--tamano-precio);
            color: var(--texto-precios);
        }
        
        .label-style {
            color: var(--color-primario); 
            font-weight: bold;
        }

        .loader {
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid var(--color-primario);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .text-shadow-strong {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="tv-screen">
        <!-- Reducido pb-8 a pb-4 para dar más espacio al contenido -->
        <header class="pt-0 pb-4 text-center shrink-0">
            <div class="inline-block bg-black/40 border-y-2 border-brand-yellow/50 px-12 py-2 backdrop-blur-sm">
                <h1 class="titulo-principal font-black uppercase tracking-[0.4em] italic text-shadow-strong">
                    MENU
                </h1>
            </div>
        </header>

        <main id="scroll-area">
            <div id="status-message" class="h-64 flex flex-col items-center justify-center text-center">
                <div class="loader mb-4" id="main-loader"></div>
                <p id="status-text" class="text-brand-yellow font-black text-2xl animate-pulse uppercase text-shadow-strong">Sincronizando menú...</p>
            </div>

            <!-- Eliminado mt-[-42px] para que la primera categoría no se corte -->
            <div id="menu-container" class="hidden flex flex-col pb-32 mt-2"></div>
        </main>
    </div>

    <script>
        const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?output=csv";

        function formatBs(value) {
            if (value === null || value === undefined || value === "") return "0,00";
            const num = parseFloat(value.toString().replace(',', '.'));
            if (isNaN(num)) return "0,00";
            return num.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatRef(value) {
            if (value === null || value === undefined || value === "") return "0.00";
            const num = parseFloat(value.toString().replace(',', '.'));
            if (isNaN(num)) return "0.00";
            return num.toFixed(2);
        }

        function getColumnValue(row, keyword) {
            const keys = Object.keys(row);
            const foundKey = keys.find(k => k.trim().toUpperCase().includes(keyword.toUpperCase()));
            return foundKey ? row[foundKey] : null;
        }

        async function fetchMenu() {
            try {
                const response = await fetch(`${BASE_URL}&t=${Date.now()}`);
                if (!response.ok) throw new Error("Error de red");
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            renderItems(results.data);
                        } else {
                            handleError("Sin datos en el Excel.");
                        }
                    }
                });
            } catch (err) {
                handleError("Error al conectar con Google Sheets.");
            }
        }

        function handleError(msg) {
            const statusText = document.getElementById('status-text');
            const loader = document.getElementById('main-loader');
            if (statusText) {
                statusText.innerText = msg;
                statusText.classList.remove('animate-pulse');
                statusText.classList.add('text-red-500');
            }
            if (loader) loader.style.display = 'none';
        }

        function renderItems(data) {
            const container = document.getElementById('menu-container');
            const statusMsg = document.getElementById('status-message');
            if (!container) return;

            container.innerHTML = '';
            const categories = {};

            data.forEach(row => {
                let cat = getColumnValue(row, "CATEGORIA") || "OTROS";
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(row);
            });

            for (const [name, items] of Object.entries(categories)) {
                const header = document.createElement('div');
                header.className = "category-header";
                header.innerText = name;
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-4";

                items.forEach(item => {
                    const itemName = getColumnValue(item, "NOMBRE") || "Sin Nombre";
                    const itemDesc = getColumnValue(item, "DESCRIPCION") || "";
                    const itemRef = getColumnValue(item, "Ref") || "0";
                    const itemBs = getColumnValue(item, "Bs") || "0";

                    const card = document.createElement('div');
                    card.className = "menu-item";
                    card.innerHTML = `
                        <div>
                            <h3 class="item-name uppercase leading-tight line-clamp-1">${itemName}</h3>
                            <p class="text-white text-[12px] leading-tight line-clamp-3 italic font-medium mt-1">${itemDesc}</p>
                        </div>
                        <div class="flex justify-between items-end border-t border-white/20 pt-2 mt-1">
                            <div class="flex items-center gap-1">
                                <span class="label-style text-sm">Ref:</span>
                                <span class="item-price-ref font-black tracking-tighter">${formatRef(itemRef)}</span>
                            </div>
                            <div class="text-right flex items-center gap-1">
                                <span class="label-style text-xs">Bs.</span>
                                <span class="text-xl font-bold text-white tracking-tighter">${formatBs(itemBs)}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }

            if (statusMsg) statusMsg.style.display = 'none';
            container.classList.remove('hidden');
            initScroll();
        }

        function initScroll() {
            const area = document.getElementById('scroll-area');
            if (!area || window.isScrolling) return;
            window.isScrolling = true;

            let speed = 0.8;
            let dir = 1;
            let pause = false;

            function step() {
                if (!pause) {
                    area.scrollTop += (speed * dir);
                    if (area.scrollTop + area.clientHeight >= area.scrollHeight - 5) {
                        pause = true;
                        setTimeout(() => { dir = -1; speed = 8; pause = false; }, 6000);
                    } else if (area.scrollTop <= 0 && dir === -1) {
                        pause = true;
                        setTimeout(() => { dir = 1; speed = 0.8; pause = false; }, 4000);
                    }
                }
                requestAnimationFrame(step);
            }
            setTimeout(step, 3000);
        }

        window.onload = fetchMenu;
        setInterval(fetchMenu, 60000);
    </script>
</body>
</html>
