<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Pollos Norma (Paginado)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style id="custom-styles">
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
        
        :root {
            --color-primario: #F08F00;    
            --color-acento: #dc2626;      
            --fondo-tarjeta: rgba(0, 0, 0, 0.85);
            --texto-precios: #ffffff;     
            --texto-descripcion: #ffffff; 
            
            --tamano-titulo-menu: 2.25rem;
            --tamano-categoria: 1.8rem;
            --tamano-nombre-plato: 1.25rem;
            --tamano-precio: 1.5rem; 

            --fuente-titulos: 'Montserrat', sans-serif;
            --fuente-cuerpo: 'Arial', sans-serif; 
            
            --tiempo-pagina: 15000ms; 
        }

        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--fuente-cuerpo);
            overflow: hidden;
        }

        #tv-screen {
            width: 800px;
            height: 1200px;
            background-color: #111;
            background-image: url('https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Fondo.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            border: 2px solid #222;
            overflow: hidden; 
            position: relative;
        }

        #pages-container {
            flex-grow: 1;
            position: relative;
            padding: 0 24px;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(50px);
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .page.exit {
            opacity: 0;
            transform: translateX(-100px);
        }

        .titulo-principal {
            font-family: var(--fuente-titulos);
            font-size: var(--tamano-titulo-menu);
            color: var(--color-primario);
        }

        .category-header {
            background: linear-gradient(90deg, var(--color-acento) 0%, rgba(220, 38, 38, 0) 100%);
            padding: 6px 15px;
            border-left: 8px solid var(--color-primario);
            font-family: var(--fuente-cuerpo); 
            text-transform: uppercase;
            font-weight: 700;
            font-size: var(--tamano-categoria);
            color: white;
            margin-top: 10px; 
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .menu-item {
            background: var(--fondo-tarjeta);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px;
            height: 125px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name {
            color: var(--color-primario);
            font-family: var(--fuente-cuerpo); 
            font-weight: bold;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        /* Sección de precios con fuente Arial forzada */
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 8px;
            font-family: Arial, sans-serif; /* Forzamos Arial para precios y etiquetas */
        }

        .price-group {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .price-label {
            color: var(--color-primario);
            font-weight: bold;
            font-size: var(--tamano-precio);
        }

        .price-value {
            color: var(--texto-precios);
            font-weight: bold;
            font-size: var(--tamano-precio);
            letter-spacing: -1px;
        }

        .text-shadow-strong {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        #page-indicator {
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: rgba(0,0,0,0.6);
            color: var(--color-primario);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            border: 1px solid var(--color-primario);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="tv-screen">
        <header class="pt-4 pb-2 text-center shrink-0">
            <div class="inline-block bg-black/40 border-y-2 border-brand-yellow/50 px-12 py-2 backdrop-blur-sm">
                <h1 class="titulo-principal font-black uppercase tracking-[0.4em] italic text-shadow-strong">
                    MENU
                </h1>
            </div>
        </header>

        <div id="status-message" class="flex-grow flex flex-col items-center justify-center text-center">
            <p id="status-text" class="text-brand-yellow font-black text-2xl animate-pulse uppercase text-shadow-strong text-[#F08F00]">Sincronizando menú...</p>
        </div>

        <main id="pages-container"></main>
        
        <div id="page-indicator" class="hidden"></div>
    </div>

    <script>
        const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?output=csv";
        const ITEMS_PER_PAGE = 14;
        const PAGE_DURATION = 15000; 

        let currentPageIndex = 0;
        let totalPages = 0;
        let pageTimer = null;

        function formatBs(value) {
            if (value === null || value === undefined || value === "") return "0,00";
            const num = parseFloat(value.toString().replace(',', '.'));
            return isNaN(num) ? "0,00" : num.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatRef(value) {
            if (value === null || value === undefined || value === "") return "0.00";
            const num = parseFloat(value.toString().replace(',', '.'));
            return isNaN(num) ? "0.00" : num.toFixed(2);
        }

        function getDynamicFontSize(text) {
            const baseSize = 1.25; 
            const maxLength = 20; 
            if (text.length <= maxLength) return `${baseSize}rem`;
            const newSize = Math.max(0.8, baseSize - ((text.length - maxLength) * 0.03));
            return `${newSize}rem`;
        }

        function getColumnValue(row, keyword) {
            const keys = Object.keys(row);
            const foundKey = keys.find(k => k.trim().toUpperCase().includes(keyword.toUpperCase()));
            return foundKey ? row[foundKey] : null;
        }

        async function fetchMenu() {
            try {
                const response = await fetch(`${BASE_URL}&t=${Date.now()}`);
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            paginateMenu(results.data);
                        }
                    }
                });
            } catch (err) {
                console.error("Error al cargar datos");
            }
        }

        function paginateMenu(data) {
            const container = document.getElementById('pages-container');
            const statusMsg = document.getElementById('status-message');
            const indicator = document.getElementById('page-indicator');
            
            clearInterval(pageTimer);
            container.innerHTML = '';
            
            const categorizedItems = [];
            data.forEach(row => {
                const cat = getColumnValue(row, "CATEGORIA") || "OTROS";
                categorizedItems.push({ ...row, categoryTitle: cat });
            });

            totalPages = Math.ceil(categorizedItems.length / ITEMS_PER_PAGE);
            
            for (let i = 0; i < totalPages; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = `page ${i === 0 ? 'active' : ''}`;
                pageDiv.id = `page-${i}`;

                const pageItems = categorizedItems.slice(i * ITEMS_PER_PAGE, (i + 1) * ITEMS_PER_PAGE);
                let lastCategoryInPage = "";

                let pageHtml = "";

                pageItems.forEach((item, idx) => {
                    if (item.categoryTitle !== lastCategoryInPage) {
                        const isContinuation = (idx === 0 && i > 0 && item.categoryTitle === categorizedItems[(i * ITEMS_PER_PAGE) - 1].categoryTitle);
                        pageHtml += `<div class="category-header">${item.categoryTitle} ${isContinuation ? '<small class="text-xs opacity-60">(Cont.)</small>' : ''}</div>`;
                        pageHtml += `<div class="grid grid-cols-2 gap-4 mb-4">`;
                        lastCategoryInPage = item.categoryTitle;
                    }

                    const itemName = getColumnValue(item, "NOMBRE") || "Sin Nombre";
                    const itemDesc = getColumnValue(item, "DESCRIPCION") || "";
                    const itemRef = getColumnValue(item, "Ref") || "0";
                    const itemBs = getColumnValue(item, "Bs") || "0";

                    const fontSize = getDynamicFontSize(itemName);

                    pageHtml += `
                        <div class="menu-item">
                            <div>
                                <h3 class="item-name uppercase" style="font-size: ${fontSize}">${itemName}</h3>
                                <p class="text-white text-[11px] leading-tight line-clamp-3 italic font-medium mt-1">${itemDesc}</p>
                            </div>
                            <div class="price-row">
                                <div class="price-group">
                                    <span class="price-label">REF:</span>
                                    <span class="price-value">${formatRef(itemRef)}</span>
                                </div>
                                <div class="price-group">
                                    <span class="price-label">BS:</span>
                                    <span class="price-value">${formatBs(itemBs)}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    if (pageItems[idx + 1] && pageItems[idx + 1].categoryTitle !== lastCategoryInPage) {
                        pageHtml += `</div>`;
                    }
                });

                pageHtml += `</div>`;
                pageDiv.innerHTML = pageHtml;
                container.appendChild(pageDiv);
            }

            statusMsg.style.display = 'none';
            indicator.classList.remove('hidden');
            updateIndicator();
            startRotation();
        }

        function updateIndicator() {
            const indicator = document.getElementById('page-indicator');
            indicator.innerText = `${currentPageIndex + 1} / ${totalPages}`;
        }

        function startRotation() {
            if (totalPages <= 1) return;
            
            pageTimer = setInterval(() => {
                const prevPage = document.getElementById(`page-${currentPageIndex}`);
                prevPage.classList.remove('active');
                prevPage.classList.add('exit');
                
                currentPageIndex = (currentPageIndex + 1) % totalPages;
                const nextPage = document.getElementById(`page-${currentPageIndex}`);
                
                nextPage.classList.remove('exit');
                
                setTimeout(() => {
                    nextPage.classList.add('active');
                    setTimeout(() => {
                        prevPage.classList.remove('exit');
                    }, 800);
                    updateIndicator();
                }, 50);

            }, PAGE_DURATION);
        }

        window.onload = fetchMenu;
        setInterval(fetchMenu, 300000); 
    </script>
</body>
</html>
