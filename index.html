<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Pollos Norma (720x1280)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style id="custom-styles">
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
        
        :root {
            --color-primario: #F08F00;    
            --color-acento: #dc2626;      
            --fondo-tarjeta: rgba(0, 0, 0, 0.9);
            --texto-precios: #ffffff;     
            --texto-descripcion: #ffffff; 
            
            --tamano-titulo-menu: 1.5rem;
            --tamano-categoria: 1.2rem;
            --tamano-nombre-plato: 0.95rem;
            --tamano-precio: 1rem; 

            --tamano-fuente-footer: 0.7rem; 
            --distancia-del-borde: 20px; 

            --fuente-titulos: 'Montserrat', sans-serif;
            --fuente-cuerpo: 'Arial', sans-serif; 
            
            --tiempo-pagina: 18000ms; 
        }

        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--fuente-cuerpo);
            overflow: hidden;
        }

        #tv-screen {
            width: 100vw;
            height: 100vh;
            max-width: 720px;
            max-height: 1280px;
            aspect-ratio: 720 / 1280;
            background-color: #111;
            background-image: url('https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Fondo.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        header {
            flex-shrink: 0;
            z-index: 50;
            padding-top: 20px; /* Reducido para ganar espacio vertical */
        }

        .titulo-container {
            display: inline-block;
            background: rgba(0,0,0,0.7);
            border-top: 2px solid var(--color-primario);
            border-bottom: 2px solid var(--color-primario);
            padding: 6px 35px;
            backdrop-filter: blur(5px);
        }

        .titulo-principal {
            font-family: var(--fuente-titulos);
            font-size: var(--tamano-titulo-menu);
            color: var(--color-primario);
            margin: 0;
        }

        #pages-container {
            flex-grow: 1;
            position: relative;
            padding: 0 15px;
            margin-top: 5px;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s ease-in-out;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
        }

        .category-header {
            background: linear-gradient(90deg, var(--color-acento) 0%, rgba(220, 38, 38, 0) 100%);
            padding: 3px 12px;
            border-left: 5px solid var(--color-primario);
            text-transform: uppercase;
            font-weight: 900;
            font-size: var(--tamano-categoria);
            color: white;
            margin: 8px 0 6px 0;
            text-shadow: 2px 2px 3px rgba(0,0,0,1);
        }

        .grid-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .menu-item {
            background: var(--fondo-tarjeta);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px 8px;
            height: 105px; /* Aumentado de 100px a 105px para la 3ra línea */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name {
            color: var(--color-primario);
            font-weight: 900;
            text-transform: uppercase;
            font-size: var(--tamano-nombre-plato);
            line-height: 1.1;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-desc {
            color: var(--texto-descripcion);
            font-size: 0.7rem;
            line-height: 1.15; /* Un poco más de aire para legibilidad */
            font-style: italic;
            opacity: 0.85;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Cambiado de 2 a 3 líneas */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 3px;
        }

        .price-tag {
            font-weight: 900;
            font-size: var(--tamano-precio);
        }

        .label-ref { color: var(--color-primario); font-size: 0.75rem; margin-right: 1px; }
        .value-ref { color: #fff; }

        /* FOOTER UNIFICADO */
        #footer-float {
            position: absolute;
            bottom: var(--distancia-del-borde);
            left: 0;
            width: 100%;
            padding: 0 9px;
            z-index: 1000;
        }

        .footer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .footer-text {
            color: #ffffff;
            font-size: var(--tamano-fuente-footer);
            font-weight: 900;
            letter-spacing: 0.15em;
            text-shadow: 2px 2px 0px #000, 0px 4px 8px rgba(0,0,0,1);
            text-align: center;
        }

        #page-indicator {
            position: absolute;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: var(--color-primario);
            padding: 3px 12px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 0.9rem;
            border: 1px solid var(--color-primario);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="tv-screen">
        <header class="text-center">
            <div class="titulo-container">
                <h1 class="titulo-principal uppercase tracking-[0.3em] italic">MENU</h1>
            </div>
        </header>

        <div id="status-message" class="flex-grow flex flex-col items-center justify-center">
            <div class="w-10 h-10 border-4 border-t-[#F08F00] border-gray-800 rounded-full animate-spin mb-4"></div>
            <p class="text-[#F08F00] font-black uppercase tracking-widest text-sm animate-pulse">Sincronizando Datos...</p>
        </div>

        <main id="pages-container"></main>
        
        <div id="footer-float">
            <div class="footer-container">
                <div class="footer-text">LOS PRECIOS INCLUYEN EL I.V.A.</div>
                <div id="page-indicator" class="hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?output=csv";
        const MAX_ITEMS_PER_PAGE = 14;
        const PAGE_DURATION = 18000; 

        let currentPageIndex = 0;
        let totalPages = 0;
        let pageTimer = null;

        function getVal(row, key) {
            if (!row) return "";
            const targetKey = key.toUpperCase().trim();
            const keys = Object.keys(row);
            let actualKey = keys.find(k => k.trim().toUpperCase() === targetKey);
            if (!actualKey && targetKey === "NOMBRE") {
                actualKey = keys.find(k => k.toUpperCase().includes("NOMBRE"));
            }
            if (!actualKey) {
                actualKey = keys.find(k => k.toUpperCase().includes(targetKey));
            }
            return actualKey ? (row[actualKey] ? row[actualKey].trim() : "") : "";
        }

        function formatPrice(val) {
            if (!val || val === "" || val === "0") return "0,00";
            let cleanVal = String(val).replace(/[^\d,.-]/g, '').replace(',', '.');
            let n = parseFloat(cleanVal);
            if (isNaN(n)) return "0,00";
            return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function fetchMenu() {
            try {
                const response = await fetch(`${BASE_URL}&t=${Date.now()}`);
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            renderMenu(results.data);
                        }
                    }
                });
            } catch (err) {
                console.error("Error cargando el CSV:", err);
            }
        }

        function renderMenu(data) {
            const container = document.getElementById('pages-container');
            const status = document.getElementById('status-message');
            const indicator = document.getElementById('page-indicator');
            
            container.innerHTML = '';
            const pages = [];
            let currentItems = [];
            let lastCat = "";

            data.forEach((row) => {
                const cat = getVal(row, "CATEGORIA") || "VARIOS";
                if (currentItems.length >= MAX_ITEMS_PER_PAGE || (cat !== lastCat && currentItems.length > 0)) {
                    pages.push([...currentItems]);
                    currentItems = [];
                }
                currentItems.push({ ...row, catName: cat });
                lastCat = cat;
            });
            if (currentItems.length > 0) pages.push(currentItems);

            totalPages = pages.length;

            pages.forEach((pageData, pIdx) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = `page ${pIdx === 0 ? 'active' : ''}`;
                pageDiv.id = `page-${pIdx}`;

                let html = "";
                let currentCatInPage = "";

                pageData.forEach((item, iIdx) => {
                    if (item.catName !== currentCatInPage) {
                        if (currentCatInPage !== "") html += `</div>`;
                        html += `<div class="category-header">${item.catName}</div>`;
                        html += `<div class="grid-items">`;
                        currentCatInPage = item.catName;
                    }

                    const nombre = getVal(item, "NOMBRE") || "SIN NOMBRE";
                    const desc = getVal(item, "DESCRIPCION") || "";
                    const ref = getVal(item, "Ref");
                    const bs = getVal(item, "Bs");

                    html += `
                        <div class="menu-item">
                            <div>
                                <div class="item-name">${nombre}</div>
                                <div class="item-desc">${desc}</div>
                            </div>
                            <div class="price-row">
                                <div class="price-tag"><span class="label-ref">Ref:</span> <span class="value-ref">${formatPrice(ref)}</span></div>
                                <div class="price-tag"><span class="label-ref">Bs:</span> <span class="value-ref">${formatPrice(bs)}</span></div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                pageDiv.innerHTML = html;
                container.appendChild(pageDiv);
            });

            status.style.display = 'none';
            indicator.classList.remove('hidden');
            updateIndicator();
            startRotation();
        }

        function updateIndicator() {
            document.getElementById('page-indicator').innerText = `${currentPageIndex + 1} / ${totalPages}`;
        }

        function startRotation() {
            if (totalPages <= 1) return;
            if (pageTimer) clearInterval(pageTimer);
            
            pageTimer = setInterval(() => {
                const current = document.getElementById(`page-${currentPageIndex}`);
                if (current) current.classList.remove('active');
                
                currentPageIndex = (currentPageIndex + 1) % totalPages;
                
                const next = document.getElementById(`page-${currentPageIndex}`);
                if (next) {
                    setTimeout(() => {
                        next.classList.add('active');
                        updateIndicator();
                    }, 50);
                }
            }, PAGE_DURATION);
        }

        window.onload = fetchMenu;
        setInterval(fetchMenu, 300000);
    </script>
</body>
</html>
