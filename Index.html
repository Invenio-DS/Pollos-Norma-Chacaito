<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#dc2626',
                            yellow: '#facc15',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;900&display=swap');
        
        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        #tv-screen {
            width: 800px;
            height: 1200px;
            background-image: url('https://raw.githubusercontent.com/Invenio-DS/Pollos-Norma-Chacaito/main/Fondo.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            border: 2px solid #222;
            overflow: hidden; 
            position: relative;
        }

        #scroll-area {
            flex-grow: 1;
            overflow-y: auto; 
            padding: 0 24px;
            scrollbar-width: none; 
            scroll-behavior: smooth;
        }

        #scroll-area::-webkit-scrollbar {
            display: none; 
        }

        .category-header {
            background: linear-gradient(90deg, #dc2626 0%, rgba(220, 38, 38, 0) 100%);
            padding: 8px 15px;
            border-left: 8px solid #facc15;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 1.8rem;
            color: white;
            margin-top: 30px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .menu-item {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            padding: 14px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .loader {
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #facc15;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .text-shadow-strong {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <div id="tv-screen">
        <!-- Ajustado pt-50 para que esté cerca del tope pero con aire. Cambia a pt-0 si quieres el tope absoluto -->
        <header class="pt-42 pb-8 text-center shrink-0">
            <div class="inline-block bg-black/40 border-y-2 border-brand-yellow/50 px-12 py-2 backdrop-blur-sm">
                <h1 class="text-4xl font-black text-brand-yellow uppercase tracking-[0.4em] italic text-shadow-strong">
                    MENU
                </h1>
            </div>
        </header>

        <main id="scroll-area">
            <div id="status-message" class="h-64 flex flex-col items-center justify-center text-center">
                <div class="loader mb-4"></div>
                <p id="status-text" class="text-brand-yellow font-black text-2xl animate-pulse uppercase text-shadow-strong">Sincronizando menú...</p>
            </div>

            <div id="menu-container" class="hidden flex flex-col pb-32"></div>
        </main>
    </div>

    <script>
        const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8En6_aEMcaVcFTeOLP3FAdpviYg1aF-6IryDOt--P-r_DcimWNmVXnjZrdVjN8TdcdK-4oAwprFU1/pub?output=csv";

        function formatBs(value) {
            if (value === null || value === undefined || value === "") return "0,00";
            const num = parseFloat(value.toString().replace(',', '.'));
            if (isNaN(num)) return "0,00";
            return num.toLocaleString('de-DE', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatRef(value) {
            if (value === null || value === undefined || value === "") return "0.00";
            const cleanValue = value.toString().replace(',', '.');
            const num = parseFloat(cleanValue);
            if (isNaN(num)) return "0.00";
            return num.toFixed(2);
        }

        async function updateMenu() {
            try {
                const response = await fetch(`${BASE_URL}&t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Error en red");
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            renderMenu(results.data);
                        } else {
                            showError("La hoja está vacía");
                        }
                    }
                });
            } catch (err) {
                showError("Error de Conexión con Google");
            }
        }

        function showError(msg) {
            const statusText = document.getElementById('status-text');
            if(statusText) {
                statusText.innerText = msg;
                statusText.classList.remove('animate-pulse');
                statusText.classList.add('text-brand-red');
            }
            document.querySelector('.loader')?.classList.add('hidden');
        }

        function getVal(row, keyToFind) {
            const keys = Object.keys(row);
            const foundKey = keys.find(k => k.trim().toLowerCase().includes(keyToFind.toLowerCase()));
            return foundKey ? row[foundKey] : null;
        }

        function renderMenu(data) {
            const container = document.getElementById('menu-container');
            const statusMsg = document.getElementById('status-message');
            if(!container) return;
            
            container.innerHTML = '';
            const groupedData = {};

            data.forEach(row => {
                const category = getVal(row, "CATEGORIA") || "Otros";
                const name = getVal(row, "NOMBRE");
                if (!name) return;
                if (!groupedData[category]) groupedData[category] = [];
                groupedData[category].push(row);
            });

            for (const categoryName in groupedData) {
                const header = document.createElement('div');
                header.className = "category-header";
                header.innerText = categoryName;
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-4";

                groupedData[categoryName].forEach(plato => {
                    const card = document.createElement('div');
                    card.className = "menu-item";
                    
                    const name = getVal(plato, "NOMBRE") || "Sin nombre";
                    const desc = getVal(plato, "DESCRIPCION") || "";
                    const refVal = getVal(plato, "Ref") || "0";
                    const bsVal = getVal(plato, "Bs") || "0";

                    const refPrice = formatRef(refVal);
                    const bsPrice = formatBs(bsVal);

                    card.innerHTML = `
                        <div>
                            <h3 class="text-xl font-black text-brand-yellow uppercase leading-tight line-clamp-1 mb-1">${name}</h3>
                            <p class="text-gray-300 text-[12px] leading-tight line-clamp-2 italic font-medium">${desc}</p>
                        </div>
                        <div class="flex justify-between items-end border-t border-white/20 pt-2 mt-1">
                            <div class="flex items-center gap-1">
                                <span class="text-brand-yellow font-black text-sm">Ref:</span>
                                <span class="text-2xl font-black text-white tracking-tighter">${refPrice}</span>
                            </div>
                            <div class="text-right flex items-center gap-1">
                                <span class="text-white/60 font-bold text-xs">Bs.</span>
                                <span class="text-xl font-bold text-gray-200 tracking-tighter">${bsPrice}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }

            if(statusMsg) statusMsg.classList.add('hidden');
            container.classList.remove('hidden');
            startAutoScroll();
        }

        function startAutoScroll() {
            const scrollArea = document.getElementById('scroll-area');
            if (!scrollArea) return;
            if (window.scrollInterval) cancelAnimationFrame(window.scrollInterval);

            let scrollSpeed = 0.8; 
            let direction = 1;
            let isPaused = false;

            function scroll() {
                if (isPaused || scrollArea.scrollHeight <= scrollArea.clientHeight) {
                    window.scrollInterval = requestAnimationFrame(scroll);
                    return;
                }

                scrollArea.scrollTop += (scrollSpeed * direction);

                if (scrollArea.scrollTop + scrollArea.clientHeight >= scrollArea.scrollHeight - 2) {
                    isPaused = true;
                    setTimeout(() => { 
                        direction = -1; 
                        scrollSpeed = 8; 
                        isPaused = false; 
                    }, 6000);
                } 
                else if (scrollArea.scrollTop <= 0 && direction === -1) {
                    isPaused = true;
                    setTimeout(() => { 
                        direction = 1; 
                        scrollSpeed = 0.8; 
                        isPaused = false; 
                    }, 4000);
                }
                
                window.scrollInterval = requestAnimationFrame(scroll);
            }
            setTimeout(scroll, 4000);
        }

        window.onload = updateMenu;
        setInterval(updateMenu, 30000);
    </script>
</body>
</html>
